<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ShipFlow - Logistics & Supply Chain Mobile Platform</title>
  <meta name="description" content="Next-Generation Enterprise Mobile Platform for Shippers, Delivery Partners, and Supply Chain Fleet Operators.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><path d=%22M20 50L45 25L80 60L55 85Z%22 fill=%22white%22/></svg>">
</head>
<body>

  <!-- ========================================================================
       Top Workspace Bar (Role Switcher & Presentation Controls)
       ======================================================================== -->
  <header class="app-top-header">
    <div class="brand-badge">
      <div class="brand-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">ShipFlow Logistics Mobile</div>
        <div class="brand-subtitle">Enterprise Shipper & Supply Chain Operating System</div>
      </div>
    </div>

    <div class="header-controls">
      <!-- Role Switcher -->
      <div class="role-switcher-group">
        <button class="role-btn active" data-role="shipper" onclick="app.setRole('shipper')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Shipper
        </button>
        <button class="role-btn" data-role="partner" onclick="app.setRole('partner')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Driver Partner
        </button>
        <button class="role-btn" data-role="admin" onclick="app.setRole('admin')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Admin
        </button>
      </div>

      <!-- Auth Modal Launcher -->
      <button class="view-mode-toggle" style="background:#0f172a; border-color:#3b82f6; color:#93c5fd;" onclick="app.openAuthModal('login', 'shipper')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Login / Register
      </button>

      <!-- MongoDB Status Indicator -->
      <button class="view-mode-toggle" id="mongoDbStatusBadge" style="background:#1e293b; border-color:#475569; color:#94a3b8;" onclick="app.syncWithMongoDB(true)">
        <span style="width:8px; height:8px; background:#f59e0b; border-radius:50%; display:inline-block;"></span>
        MongoDB Offline
      </button>

      <!-- View Switcher (Frame vs Responsive) -->
      <button class="view-mode-toggle" id="viewModeBtn" onclick="app.toggleViewMode()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Full View
      </button>
    </div>
  </header>

  <!-- ========================================================================
       Mobile Device Wrapper (iPhone / Android Flagship Simulator Frame)
       ======================================================================== -->
  <div class="device-wrapper phone-frame" id="deviceWrapper">
    <div class="mobile-screen" id="mobileScreen">

      <!-- Dynamic Island / Speaker Notch -->
      <div class="dynamic-island">
        <div class="island-camera"></div>
        <div class="island-sensor"></div>
      </div>

      <!-- Native Mobile Status Bar -->
      <div class="status-bar">
        <span class="status-time" id="mobileLiveTime">09:41</span>
        <div class="status-icons">
          <!-- Cellular 5G -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="16" width="3" height="6" rx="1"/>
            <rect x="7" y="12" width="3" height="10" rx="1"/>
            <rect x="12" y="8" width="3" height="14" rx="1"/>
            <rect x="17" y="3" width="3" height="19" rx="1"/>
          </svg>
          <!-- WiFi -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
          <!-- Battery -->
          <svg width="20" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="16" height="10" rx="2" ry="2"/>
            <line x1="22" y1="11" x2="22" y2="13"/>
            <rect x="4" y="9" width="11" height="6" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <!-- App Header Bar Inside Mobile -->
      <div class="mobile-app-bar">
        <div class="app-bar-left">
          <div class="app-bar-avatar" id="appBarAvatar" onclick="app.switchTab('profile')">AV</div>
          <div class="app-bar-info">
            <div class="app-bar-user">
              <span id="appBarUserName">Alex Vance</span>
              <span class="app-bar-role-badge" id="appBarUserRole">Shipper</span>
            </div>
            <div class="app-bar-sub" id="appBarUserSub">Nexus Logistics Inc.</div>
          </div>
        </div>

        <div class="app-bar-actions">
          <button class="icon-btn" title="Notifications" onclick="app.switchTab('notifications')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <div class="badge-dot"></div>
          </button>
        </div>
      </div>

      <!-- Main Scrollable App Screen Content -->
      <main class="screen-scroll-container" id="screenScrollContainer">
        <!-- Rendered reactively by ShipFlowApp in app.js -->
      </main>

      <!-- Bottom Mobile Navigation Bar -->
      <nav class="bottom-nav-bar" id="bottomNavBar">
        <!-- Rendered based on role in app.js -->
      </nav>

      <!-- Home Indicator Bar (iOS style) -->
      <div class="home-indicator"></div>

      <!-- ====================================================================
           Splash Screen (Animated Intro Screen)
           ==================================================================== -->
      <div class="splash-screen" id="splashScreen">
        <div class="splash-logo-circle">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"/>
          </svg>
        </div>
        <h1 class="splash-title">ShipFlow</h1>
        <p class="splash-tagline">Intelligent Shipper & Freight Operations for Global Supply Chains</p>
        <div class="splash-loader"></div>
        <button class="btn btn-secondary btn-sm" style="background:rgba(255,255,255,0.15); color:#fff; border:none;" onclick="document.getElementById('splashScreen').remove()">
          Launch Dashboard →
        </button>
      </div>

      <!-- ====================================================================
           Shared Modal Bottom Sheet
           ==================================================================== -->
      <div class="modal-overlay" id="commonModalOverlay">
        <div class="bottom-sheet" id="commonModalSheet">
          <div class="sheet-drag-handle"></div>
          <div class="sheet-header">
            <h3 class="sheet-title" id="commonModalTitle">ShipFlow Dialog</h3>
            <button class="sheet-close-btn" onclick="app.closeModal()">✕</button>
          </div>
          <div id="commonModalBody">
            <!-- Modal Body Content -->
          </div>
        </div>
      </div>

      <!-- ====================================================================
           Toast Container for Push Alerts
           ==================================================================== -->
      <div class="toast-container" id="toastContainer"></div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
